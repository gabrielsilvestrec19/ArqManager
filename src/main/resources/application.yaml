spring:
  application:
    name: arqmanager
  datasource:
    url: jdbc:mysql://localhost:3306/arqmanager_db
    username: root
    password : ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialtec: org.hibernate.dialect.MySQLDialect